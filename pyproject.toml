[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiplast"
version = "0.5.0"
description = "Structured extraction toolkit for wikiplast.ir public pages."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ali Aghili", email = "alisadeghiaghili@gmail.com" }]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.31",
    "types-beautifulsoup4>=4.12",
]

[project.scripts]
wikiplast = "wikiplast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit the live wikiplast.ir website",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wikiplast"]
mypy_path = "src"
